                - serviceSales.delete
                - visits.read
                - visits.create
                - visits.update
                - visits.delete
                - feedback.read
                - feedback.create
                - feedback.update
                - feedback.delete
                - courses.read
                - courses.create
                - courses.update
                - courses.delete
                - cards.read
                - cards.create
                - cards.update
                - cards.delete
                - coreInvestments.read
                - coreInvestments.create
                - coreInvestments.update
                - coreInvestments.delete
                - medicinePurchases.read
                - medicinePurchases.create
                - medicinePurchases.update
                - medicinePurchases.delete
                - marketingExpenses.read
                - marketingExpenses.create
                - marketingExpenses.update
                - marketingExpenses.delete
                - csrFunds.read
                - csrFunds.create
                - csrFunds.update
                - csrFunds.delete
                - loans.read
                - loans.create
                - loans.update
                - loans.delete
                - loanRepayments.read
                - loanRepayments.create
                - loanRepayments.update
                - loanRepayments.delete
                - advanceTaxes.read
                - advanceTaxes.create
                - advanceTaxes.update
                - advanceTaxes.delete
                - otherExpenses.read
                - otherExpenses.create
                - otherExpenses.update
                - otherExpenses.delete
                - directorSalaries.read
