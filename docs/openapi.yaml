    responses:
        Unauthorized:
            description: Authentication required / invalid credentials / bad refresh token
            content:
                application/json:
                    schema: { $ref: "#/components/schemas/Error" }
        Forbidden:
            description: Insufficient permissions or branch access denied
            content:
                application/json:
                    schema: { $ref: "#/components/schemas/Error" }
        NotFound:
            description: Record or route not found
            content:
                application/json:
                    schema: { $ref: "#/components/schemas/Error" }
        Conflict:
            description: Duplicate record (Prisma P2002)
            content:
                application/json:
                    schema: { $ref: "#/components/schemas/Error" }
        ValidationError:
            description: Zod validation failed (422) with errors array
            content:
                application/json:
                    schema: { $ref: "#/components/schemas/Error" }
        RateLimited:
            description: Too many requests from this client IP in the configured time window
            content:
                application/json:
                    schema: { $ref: "#/components/schemas/Error" }

                "401": { $ref: "#/components/responses/Unauthorized" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "422": { $ref: "#/components/responses/ValidationError" }
