            required: [permissionKeys]
            properties:
                permissionKeys:
                    type: array
                    minItems: 1
                    maxItems: 50
                    items:
                        type: string
                        minLength: 1
                        maxLength: 120
                        pattern: '^(users|branches|items|services|sales|serviceSales|visits|feedback)\.(read|create|update|delete)$'
