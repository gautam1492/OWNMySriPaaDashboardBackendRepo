openapi: 3.0.3
info:
    title: SriPAA Growth System API
    version: 1.0.0
    description: >
        SUPER_ADMIN and ADMIN have all-branch access. DIRECTOR has broad default
        permissions but branch-specific data is limited to assigned active branches.
        Directors can manage users at or below Director only within their own branch
        assignments. Only SUPER_ADMIN may create or manage ADMIN accounts.
servers:
    - url: /api/v1
tags:
    - name: System
    - name: Auth
    - name: Roles
    - name: Branches
    - name: Users
    - name: Items
    - name: Services
    - name: Sales
    - name: ServiceSales
    - name: PatientVisits
    - name: Feedback
    - name: Dashboard
    - name: Audit
    - name: Courses
    - name: Cards
    - name: Loans
    - name: Directors
    - name: Investments
    - name: Purchases
    - name: Expenses
    - name: CsrFund
paths:
    /health:
        servers:
            - url: /
        get:
            tags: [System]
            summary: Liveness check
            description: Confirms the API process is running. Does not check database connectivity.
            security: []
            responses:
                "200":
                    description: API process is healthy
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [success, status]
                                properties:
                                    success: { type: boolean, example: true }
                                    status: { type: string, enum: [healthy] }
    /health/ready:
        servers:
            - url: /
        get:
            tags: [System]
            summary: Readiness check
            description: Checks whether the database dependency is reachable.
            security: []
            responses:
                "200":
                    description: API and database are ready
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [success, status, database]
                                properties:
                                    success: { type: boolean, example: true }
                                    status: { type: string, enum: [ready] }
                                    database: { type: string, enum: [up] }
                "503":
                    description: Database is unavailable
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [success, status, database, message]
                                properties:
                                    success: { type: boolean, example: false }
                                    status: { type: string, enum: [degraded] }
                                    database: { type: string, enum: [down] }
                                    message: { type: string }
    /auth/login:
        post:
            tags: [Auth]
            summary: Log in (sets access + refresh HttpOnly cookies)
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [email, password]
                            properties:
                                email: { type: string, format: email, maxLength: 255 }
                                password: { type: string, minLength: 8, maxLength: 128 }
            responses:
                "200":
                    description: Cookies set; body contains the user only (no tokens)
                    headers:
                        Set-Cookie:
                            description: sripaa_access_token (path=/) and sripaa_refresh_token (path=/api/v1/auth), both HttpOnly.
                            schema: { type: string }
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/AuthUserPayload" }
                "401": { $ref: "#/components/responses/Unauthorized" }
                "422": { $ref: "#/components/responses/ValidationError" }
    /auth/forgot-password:
        post:
            tags: [Auth]
            summary: Request a password reset
            description: Rate limited to five requests per IP per 15 minutes. The response intentionally indicates whether the email belongs to an eligible account.
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [email]
                            properties:
                                email: { type: string, format: email, maxLength: 255 }
            responses:
                "200":
                    description: Result indicates account-not-found, ineligible, cooldown, sent, or delivery-failed state.
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    status:
                                        type: string
                                        enum:
                                            [
                                                not-found,
                                                not-eligible,
                                                cooldown,
                                                sent,
                                                delivery-failed,
                                            ]
                "422": { $ref: "#/components/responses/ValidationError" }
                "429": { $ref: "#/components/responses/RateLimited" }
    /auth/reset-password:
        post:
            tags: [Auth]
            summary: Reset password using a one-time token
            description: Reset links expire after 30 minutes, are single-use, and passwords must satisfy the reset password validator.
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [token, password, confirmPassword]
                            properties:
                                token: { type: string, minLength: 40, maxLength: 100 }
                                password: { type: string, minLength: 8, maxLength: 128 }
                                confirmPassword: { type: string, minLength: 8, maxLength: 128 }
            responses:
                "200":
                    description: Password updated; the user may sign in.
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/SuccessNull" }
                "422": { $ref: "#/components/responses/ValidationError" }
                "429": { $ref: "#/components/responses/RateLimited" }
    /auth/refresh:
        post:
            tags: [Auth]
            summary: Rotate refresh token (cookie-only, no body)
            description: Reads the sripaa_refresh_token HttpOnly cookie, rotates it (one-time-use), and re-issues both cookies. Reusing a revoked token revokes every session for that user.
            responses:
                "200":
                    description: Cookies rotated; body contains the user only (no tokens)
                    headers:
                        Set-Cookie:
                            description: Fresh sripaa_access_token and sripaa_refresh_token values.
                            schema: { type: string }
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/AuthUserPayload" }
                "401": { $ref: "#/components/responses/Unauthorized" }
    /auth/logout:
        post:
            tags: [Auth]
            summary: Log out (no auth required; revokes the refresh-cookie session)
            description: Works even when the access cookie is expired or missing.
            responses:
                "200":
                    description: Logged out; both auth cookies cleared
                    headers:
                        Set-Cookie:
                            description: sripaa_access_token and sripaa_refresh_token cleared (empty values, matching paths).
                            schema: { type: string }
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/SuccessNull" }
    /auth/me:
        get:
            tags: [Auth]
            summary: Current user (access cookie)
            security: [{ cookieAuth: [] }]
            responses:
                "200":
                    description: Authenticated user
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/SuccessAuthUser" }
                "401": { $ref: "#/components/responses/Unauthorized" }
    /auth/change-password:
        post:
            tags: [Auth]
            summary: Change password (revokes all sessions, clears cookies)
            security: [{ cookieAuth: [] }]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [currentPassword, newPassword]
                            properties:
                                currentPassword: { type: string, minLength: 8 }
                                newPassword: { type: string, minLength: 8, maxLength: 128 }
            responses:
                "200":
                    description: Password changed
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/SuccessNull" }
                "401": { $ref: "#/components/responses/Unauthorized" }
                "422": { $ref: "#/components/responses/ValidationError" }

    /roles:
        get:
            tags: [Roles]
            summary: List roles (SUPER_ADMIN / ADMIN / DIRECTOR)
            security: [{ cookieAuth: [] }]
            responses:
                "200":
                    description: Roles ordered by name (raw array)
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/SuccessArray" }
                "401": { $ref: "#/components/responses/Unauthorized" }
                "403": { $ref: "#/components/responses/Forbidden" }
    /branches:
        get:
            tags: [Branches]
            summary: List active branches
            security: [{ cookieAuth: [] }]
            responses:
                "200":
                    description: Active branches ordered by name (raw array)
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/SuccessArray" }
                "401": { $ref: "#/components/responses/Unauthorized" }
        post:
            tags: [Branches]
            summary: Create branch (requires branches.create permission)
            security: [{ cookieAuth: [] }]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [name, code]
                            properties:
                                name: { type: string, minLength: 1, maxLength: 160 }
                                code: { type: string, minLength: 1, maxLength: 32 }
            responses:
                "201":
                    description: Branch created
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/SuccessObject" }
                "401": { $ref: "#/components/responses/Unauthorized" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "409": { $ref: "#/components/responses/Conflict" }
                "422": { $ref: "#/components/responses/ValidationError" }
    /users:
        get:
            tags: [Users]
            summary: List users (SUPER_ADMIN / ADMIN / DIRECTOR)
            security: [{ cookieAuth: [] }]
            parameters:
                - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
                - {
                      in: query,
                      name: limit,
                      schema: { type: integer, minimum: 1, maximum: 100, default: 20 },
                  }
                - { in: query, name: search, schema: { type: string, maxLength: 100 } }
            responses:
                "200":
                    description: Paginated users (password hashes stripped)
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/PaginatedUsers" }
                "401": { $ref: "#/components/responses/Unauthorized" }
                "403": { $ref: "#/components/responses/Forbidden" }
        post:
            tags: [Users]
            summary: Create user (SUPER_ADMIN / ADMIN / DIRECTOR; only SUPER_ADMIN may create ADMIN)
            description: >
                Role hierarchy applies. Only SUPER_ADMIN may create an ADMIN account;
                ADMIN and DIRECTOR may create users permitted by their role hierarchy.
                DIRECTOR may assign users only to branches assigned to the acting Director.
                Branch-scoped roles and DIRECTOR accounts must be created with at least one
                active branch ID. SUPER_ADMIN and ADMIN do not require branch assignments.
            security: [{ cookieAuth: [] }]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [name, email, password, roleId]
                            properties:
                                name: { type: string, minLength: 2, maxLength: 160 }
                                email: { type: string, format: email }
                                password: { type: string, minLength: 8, maxLength: 128 }
                                roleId: { type: string, minLength: 1 }
                                branchIds:
                                    type: array
                                    items: { type: string, minLength: 1 }
                                    description: Required with at least one active branch for DIRECTOR, ACCOUNTS_FINANCE, DATA_ENTRY, and VIEWER_AUDITOR. Optional for SUPER_ADMIN and ADMIN, which have all-branch access.
                                mobileNumber:
                                    type: string
                                    maxLength: 30
                                    description: User contact number.
            responses:
                "201":
                    description: User created
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/SuccessObject" }
                "401": { $ref: "#/components/responses/Unauthorized" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "409": { $ref: "#/components/responses/Conflict" }
                "422": { $ref: "#/components/responses/ValidationError" }
    /users/{id}:
        patch:
            tags: [Users]
            summary: Update user (SUPER_ADMIN / ADMIN / DIRECTOR; only SUPER_ADMIN may edit ADMIN)
            description: >
                The target's current role and any requested new role are both checked.
                Only SUPER_ADMIN may edit any field of an ADMIN account, including
                name, email, mobile number, role, branch assignments, and active status.
            security: [{ cookieAuth: [] }]
            parameters:
                - { in: path, name: id, required: true, schema: { type: string } }
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                name: { type: string, minLength: 2, maxLength: 160 }
                                email: { type: string, format: email }
                                roleId: { type: string, minLength: 1 }
                                branchIds:
                                    type: array
                                    items: { type: string, minLength: 1 }
                                    description: This validator accepts branchIds here, but use PATCH /users/{id}/branches to update branch assignments.
                                isActive: { type: boolean }
                                mobileNumber:
                                    type: string
                                    maxLength: 30
                                    description: User contact number.
            responses:
                "200":
                    description: User updated
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/SuccessObject" }
                "401": { $ref: "#/components/responses/Unauthorized" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "422": { $ref: "#/components/responses/ValidationError" }
    /users/{id}/status:
        patch:
            tags: [Users]
            summary: Update user status (SUPER_ADMIN / ADMIN / DIRECTOR; hierarchy rules apply)
            security: [{ cookieAuth: [] }]
            parameters:
                - { in: path, name: id, required: true, schema: { type: string } }
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [isActive]
                            properties:
                                isActive: { type: boolean }
            responses:
                "200":
                    description: User status updated
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/SuccessObject" }
                "401": { $ref: "#/components/responses/Unauthorized" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "422": { $ref: "#/components/responses/ValidationError" }
    /users/{id}/role:
        patch:
            tags: [Users]
            summary: Update user role (SUPER_ADMIN / ADMIN / DIRECTOR; only SUPER_ADMIN may assign ADMIN)
            description: Both the target's current role and the role being assigned are checked against the actor's hierarchy. Only SUPER_ADMIN may assign the ADMIN role.
            security: [{ cookieAuth: [] }]
            parameters:
                - { in: path, name: id, required: true, schema: { type: string } }
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [roleId]
                            properties:
                                roleId: { type: string, minLength: 1 }
            responses:
                "200":
                    description: User role updated
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/SuccessObject" }
                "401": { $ref: "#/components/responses/Unauthorized" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "422": { $ref: "#/components/responses/ValidationError" }
    /users/{id}/branches:
        patch:
            tags: [Users]
            summary: Update user branch assignments (SUPER_ADMIN / ADMIN / DIRECTOR)
            description: DIRECTOR may assign users at or below Director level only to branches assigned to the acting Director. SUPER_ADMIN and ADMIN can assign any active branch.
            security: [{ cookieAuth: [] }]
            parameters:
                - { in: path, name: id, required: true, schema: { type: string } }
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [branchIds]
                            properties:
                                branchIds:
                                    type: array
                                    items: { type: string, minLength: 1 }
                                    description: Branch IDs to assign to the user.
            responses:
                "200":
                    description: User branch updated
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/SuccessObject" }
                "401": { $ref: "#/components/responses/Unauthorized" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "422": { $ref: "#/components/responses/ValidationError" }
        delete:
            tags: [Users]
            summary: Delete user (SUPER_ADMIN / ADMIN; DIRECTOR may delete users at or below Director level)
            security: [{ cookieAuth: [] }]
            parameters:
                - { in: path, name: id, required: true, schema: { type: string } }
            responses:
                "200":
                    description: User deleted
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/SuccessNull" }
                "401": { $ref: "#/components/responses/Unauthorized" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "404": { $ref: "#/components/responses/NotFound" }

    /users/{id}/permissions:
        get:
            tags: [Users]
            summary: List a user's granted permissions (SUPER_ADMIN / ADMIN / DIRECTOR)
            security: [{ cookieAuth: [] }]
            parameters:
                - { in: path, name: id, required: true, schema: { type: string } }
            responses:
                "200":
                    description: Granted module-wise permissions for the user
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/UserPermissionList" }
                "401": { $ref: "#/components/responses/Unauthorized" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "404": { $ref: "#/components/responses/NotFound" }
        post:
            tags: [Users]
            summary: Grant module-wise permissions to a managed user
            description: >
                Only SUPER_ADMIN, ADMIN, or DIRECTOR may grant permissions, and only to
                users they are allowed to manage. The service currently checks the actor's
                saved UserPermission grants (not role defaults) when deciding if a key can
                be granted. Only SUPER_ADMIN may grant permissions to an ADMIN user.
                The request validator accepts keys under users, branches, items, services,
                sales, serviceSales, visits, and feedback; other keys in PermissionKey are
                currently rejected by this endpoint.
            security: [{ cookieAuth: [] }]
            parameters:
                - { in: path, name: id, required: true, schema: { type: string } }
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/PermissionGrantRequest" }
            responses:
                "201":
                    description: Permissions granted
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/PermissionGrantResponse" }
                "401": { $ref: "#/components/responses/Unauthorized" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "404": { $ref: "#/components/responses/NotFound" }
                "409": { $ref: "#/components/responses/Conflict" }
                "422": { $ref: "#/components/responses/ValidationError" }
    /users/{id}/permissions/{permissionKey}:
        delete:
            tags: [Users]
            summary: Revoke a granted permission from a managed user
            security: [{ cookieAuth: [] }]
            parameters:
                - { in: path, name: id, required: true, schema: { type: string } }
                - {
                      in: path,
                      name: permissionKey,
                      required: true,
                      schema: { $ref: "#/components/schemas/PermissionKey" },
                  }
            responses:
                "200":
                    description: Permission revoked
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/PermissionGrantResponse" }
                "401": { $ref: "#/components/responses/Unauthorized" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "404": { $ref: "#/components/responses/NotFound" }
    /branches/{id}:
        delete:
            tags: [Branches]
            summary: Delete branch (requires branches.delete permission)
            security: [{ cookieAuth: [] }]
            parameters:
                - { in: path, name: id, required: true, schema: { type: string } }
            responses:
                "200":
                    description: Branch deleted
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/SuccessNull" }
                "401": { $ref: "#/components/responses/Unauthorized" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "404": { $ref: "#/components/responses/NotFound" }

    /items:
        get:
            tags: [Items]
            summary: List medicine and OTC catalog items
            security: [{ cookieAuth: [] }]
            parameters:
                - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
                - {
                      in: query,
                      name: limit,
                      schema: { type: integer, minimum: 1, maximum: 100, default: 20 },
                  }
                - { in: query, name: search, schema: { type: string, maxLength: 100 } }
                - { in: query, name: type, schema: { type: string, enum: [MEDICINE, OTC] } }
            responses:
                "200":
                    description: Paginated items
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/Paginated" }
                "401": { $ref: "#/components/responses/Unauthorized" }
        post:
            tags: [Items]
            summary: Create item (requires items.create permission)
            security: [{ cookieAuth: [] }]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [name, type]
                            properties:
                                name: { type: string, minLength: 2, maxLength: 160 }
                                type: { type: string, enum: [MEDICINE, OTC] }
                                isActive: { type: boolean }
            responses:
                "201":
                    description: Item created
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/SuccessObject" }
                "401": { $ref: "#/components/responses/Unauthorized" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "409": { $ref: "#/components/responses/Conflict" }
                "422": { $ref: "#/components/responses/ValidationError" }
    /items/{id}:
        get:
            tags: [Items]
            summary: Get item by id
            security: [{ cookieAuth: [] }]
            parameters:
                - { in: path, name: id, required: true, schema: { type: string } }
            responses:
                "200":
                    description: Item
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/SuccessObject" }
                "401": { $ref: "#/components/responses/Unauthorized" }
                "404": { $ref: "#/components/responses/NotFound" }
        patch:
            tags: [Items]
            summary: Update item (requires items.update permission)
            security: [{ cookieAuth: [] }]
            parameters:
                - { in: path, name: id, required: true, schema: { type: string } }
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                name: { type: string, minLength: 2, maxLength: 160 }
                                type: { type: string, enum: [MEDICINE, OTC] }
                                isActive: { type: boolean }
            responses:
                "200":
                    description: Item updated
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/SuccessObject" }
    /services:
        get:
            tags: [Services]
            summary: List active services (raw array, not paginated)
            security: [{ cookieAuth: [] }]
            responses:
                "200":
                    description: Active services ordered by name
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/SuccessArray" }
                "401": { $ref: "#/components/responses/Unauthorized" }
        post:
            tags: [Services]
            summary: Create service (requires services.create permission)
            security: [{ cookieAuth: [] }]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [name, type]
                            properties:
                                name: { type: string, minLength: 2, maxLength: 160 }
                                type: { type: string, enum: [CONSULTATION, THERAPY, OTHER] }
                                isActive: { type: boolean }
            responses:
                "201":
                    description: Service created
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/SuccessObject" }
                "401": { $ref: "#/components/responses/Unauthorized" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "409": { $ref: "#/components/responses/Conflict" }
                "422": { $ref: "#/components/responses/ValidationError" }
    /services/{id}:
        patch:
            tags: [Services]
            summary: Update service (requires services.update permission)
            security: [{ cookieAuth: [] }]
            parameters:
                - { in: path, name: id, required: true, schema: { type: string } }
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                name: { type: string, minLength: 2, maxLength: 160 }
                                type: { type: string, enum: [CONSULTATION, THERAPY, OTHER] }
                                isActive: { type: boolean }
            responses:
                "200":
                    description: Service updated
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/SuccessObject" }
                "401": { $ref: "#/components/responses/Unauthorized" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "422": { $ref: "#/components/responses/ValidationError" }
    /sales:
        get:
            tags: [Sales]
            summary: List medicine and OTC sales
            security: [{ cookieAuth: [] }]
            parameters:
                - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
                - {
                      in: query,
                      name: limit,
                      schema: { type: integer, minimum: 1, maximum: 100, default: 20 },
                  }
                - { in: query, name: search, schema: { type: string, maxLength: 100 } }
