components:
    securitySchemes:
        cookieAuth:
            type: apiKey
            in: cookie
            name: sripaa_access_token
            description: 'HttpOnly access-token cookie set by /auth/login and rotated by /auth/refresh. Send requests with credentials (fetch credentials:"include", axios withCredentials:true).'
    schemas:
        AuthUser:
            type: object
            properties:
                id: { type: string }
                name: { type: string }
                email: { type: string, format: email }
                roleId: { type: string }
                branchIds:
                    type: array
                    items: { type: string }
                    description: Assigned branch IDs. DIRECTOR and branch-scoped roles are limited to these branches; SUPER_ADMIN and ADMIN may have no assignments and access all branches.
                role:
                    type: string
                    enum:
                        [SUPER_ADMIN, ADMIN, DIRECTOR, ACCOUNTS_FINANCE, DATA_ENTRY, VIEWER_AUDITOR]
                permissions:
                    type: array
                    items: { type: string }
                    description: "Effective permission keys: role defaults + granted extras."
        AuthUserPayload:
            type: object
            description: Tokens are delivered as HttpOnly cookies, never in the body.
            properties:
                success: { type: boolean, example: true }
                message: { type: string }
                data:
                    type: object
                    properties:
                        user: { $ref: "#/components/schemas/AuthUser" }
                        accessTokenExpiresAt:
                            type: string
                            format: date-time
                            description: ISO expiry of the access cookie; safe to expose so clients can rotate proactively.
        SuccessNull:
            type: object
            properties:
                success: { type: boolean, example: true }
                message: { type: string }
                data: { nullable: true }
        SuccessObject:
            type: object
            properties:
                success: { type: boolean, example: true }
                message: { type: string }
                data: { type: object }
        SuccessArray:
            type: object
            properties:
                success: { type: boolean, example: true }
                message: { type: string }
                data: { type: array, items: { type: object } }
        SuccessAuthUser:
            type: object
            properties:
                success: { type: boolean, example: true }
                message: { type: string }
                data: { $ref: "#/components/schemas/AuthUser" }
        Pagination:
            type: object
            properties:
                page: { type: integer }
                limit: { type: integer }
                total: { type: integer }
                totalPages: { type: integer }
        Paginated:
            type: object
            properties:
                success: { type: boolean, example: true }
                message: { type: string }
                data:
                    type: object
                    properties:
                        items: { type: array, items: { type: object } }
                        pagination: { $ref: "#/components/schemas/Pagination" }
        PaginatedUsers:
            type: object
            properties:
                success: { type: boolean, example: true }
                message: { type: string }
                data:
                    type: object
                    properties:
                        items:
                            type: array
                            items: { $ref: "#/components/schemas/UserListItem" }
                        pagination: { $ref: "#/components/schemas/Pagination" }
        UserListItem:
            type: object
            properties:
                id: { type: string }
                name: { type: string }
                email: { type: string, format: email }
                mobileNumber: { type: string, nullable: true }
                roleId: { type: string }
                role: { type: object, properties: { id: { type: string }, name: { type: string } } }
                isActive: { type: boolean }
                branchIds:
                    type: array
                    items: { type: string }
                    description: IDs of branches assigned to this user.
                branches:
                    type: array
                    description: Assigned branch details for display.
                    items:
                        type: object
                        required: [id, name, code]
                        properties:
                            id: { type: string }
                            name: { type: string }
                            code: { type: string }
        Error:
            type: object
            properties:
                success: { type: boolean, example: false }
                message: { type: string }
                errors:
                    type: array
                    items:
                        type: object
                        properties:
                            field: { type: string }
                            message: { type: string }
        ItemInput:
            type: object
            required: [name, type]
            properties:
                name: { type: string, minLength: 2, maxLength: 160, example: "Aspirin" }
                type: { type: string, enum: [MEDICINE, OTC], example: MEDICINE }
                isActive: { type: boolean, default: true, example: true }
        ItemPatch:
            type: object
            properties:
                name:
                    {
                        type: string,
                        minLength: 2,
                        maxLength: 160,
                        example: "Aspirin Extra Strength",
                    }
                type: { type: string, enum: [MEDICINE, OTC], example: MEDICINE }
                isActive: { type: boolean, example: true }
        SaleInput:
            type: object
            description: Each calculated line total, subtotal, tax amount, and total amount must not exceed 9,999,999,999.99 because sale monetary columns use DECIMAL(12,2).
            required: [date, branchId, entryType, items]
            properties:
                date: { type: string, format: date }
                branchId: { type: string, minLength: 1 }
                entryType: { type: string, enum: [OTC, DOCTOR_PRESCRIBED_MEDICINE] }
                items:
                    type: array
                    minItems: 1
                    maxItems: 100
                    items:
                        type: object
                        required: [itemId, unitSold, unitPrice]
                        properties:
                            itemId: { type: string, minLength: 1 }
                            unitSold: { type: integer, minimum: 1, maximum: 100000 }
                            unitPrice: { type: number, minimum: 0, maximum: 999999999.99 }
                gstPercentage: { type: number, minimum: 0, maximum: 100, default: 2.5 }
                sgstPercentage: { type: number, minimum: 0, maximum: 100, default: 2.5 }
        ServiceSaleInput:
            type: object
            required: [date, branchId, serviceType, serviceId, amount]
            properties:
                date: { type: string, format: date }
                branchId: { type: string, minLength: 1 }
                serviceType: { type: string, enum: [CONSULTATION, THERAPY, OTHER] }
                serviceId: { type: string, minLength: 1 }
                amount: { type: number, minimum: 0, maximum: 999999999.99 }
        FeedbackInput:
            type: object
            required:
                [
